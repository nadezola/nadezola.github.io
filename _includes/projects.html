<div class="projects-section">
  <h2><a href="{{ '/projects/' | relative_url }}">My Projects</a></h2>
  <div class="projects-grid">
    {% for project in site.data.projects limit:include.limit %}
      <div class="project-card">
          <img src="{{ site.baseurl }}/assets/projects/{{ project.img }}" alt="{{ project.title }}">
          <p class="title">{{ project.title }}</p>
      </div>
    {% endfor %}
  </div>
  {% if include.limit %}
    <p class="projects-more"><a href="{{ '/projects/' | relative_url }}" aria-label="Find more projects here">find more here &gt;&gt;</a></p>
  {% endif %}
</div>
